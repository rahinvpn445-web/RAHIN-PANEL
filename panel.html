<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d18">
<title>RAHIN — VPN Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#070d18; --panel:rgba(14,23,40,.78); --panel2:rgba(18,30,52,.55);
  --line:rgba(126,156,198,.14); --line2:rgba(126,156,198,.26);
  --ink:#e8eef8; --mut:#94a3bb; --faint:#5f6e86;
  --teal:#2fd6c3; --blue:#54a9ff; --amber:#ffb454; --green:#3ddc97; --red:#ff6b7a;
  --disp:'Chakra Petch',sans-serif; --body:'IBM Plex Sans',sans-serif; --mono:'JetBrains Mono',monospace;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
[dir="rtl"] body{font-family:'Vazirmatn',var(--body)}
[dir="rtl"] .brand-t,[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3,[dir="rtl"] .panel-head h2,[dir="rtl"] .live-tag,[dir="rtl"] .m-tag,[dir="rtl"] .panel-badge{font-family:'Vazirmatn',var(--disp)}
::selection{background:rgba(47,214,195,.3)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(126,156,198,.22);border-radius:8px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- layered background ---------- */
.bg{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(900px 620px at 6% -8%, rgba(47,214,195,.10), transparent 60%),
  radial-gradient(760px 520px at 100% 2%, rgba(84,169,255,.08), transparent 55%),
  radial-gradient(720px 700px at 88% 102%, rgba(84,169,255,.10), transparent 65%),
  var(--bg)}
.bg .grid{position:absolute;inset:0;background-image:
  linear-gradient(rgba(140,170,210,.045) 1px,transparent 1px),
  linear-gradient(90deg,rgba(140,170,210,.045) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(1200px 820px at 28% 0%,#000 30%,transparent 78%);
  mask-image:radial-gradient(1200px 820px at 28% 0%,#000 30%,transparent 78%)}
.bg .glow{position:absolute;border-radius:50%;will-change:transform}
.bg .g1{width:620px;height:620px;left:-180px;top:-220px;background:radial-gradient(circle,rgba(47,214,195,.13),transparent 65%);animation:drift 26s ease-in-out infinite alternate}
.bg .g2{width:520px;height:520px;right:-160px;bottom:-180px;background:radial-gradient(circle,rgba(84,169,255,.14),transparent 70%);will-change:auto;transform:translateZ(0)}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(70px,50px)}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}

/* ---------- sidebar ---------- */
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:20px 14px;border-right:1px solid var(--line);background:rgba(9,15,28,.55);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);padding:2px 6px 16px}
.brand svg{width:36px;height:36px;flex:none;filter:drop-shadow(0 4px 14px rgba(47,214,195,.35))}
.brand-t{font:700 17px/1 var(--disp);letter-spacing:.07em}
.brand-t small{display:block;font:600 8.5px var(--mono);letter-spacing:.32em;color:var(--faint);margin-top:4px}
.nav-label{font:600 9.5px var(--mono);letter-spacing:.22em;color:var(--faint);text-transform:uppercase;padding:14px 11px 7px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--mut);font-weight:500;font-size:13.5px;text-decoration:none;position:relative;transition:color .2s,background .2s,transform .15s}
.nav-item svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav-item:hover{color:var(--ink);background:rgba(126,156,198,.08);transform:translateX(2px)}
.nav-item.active{color:var(--teal);background:linear-gradient(90deg,rgba(47,214,195,.14),rgba(47,214,195,.02))}
.nav-item.active::before{content:'';position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--teal);box-shadow:0 0 12px var(--teal)}
.nav-item b{margin-left:auto;font:600 10.5px var(--mono);color:var(--mut);background:rgba(126,156,198,.12);padding:2px 7px;border-radius:20px}
.nav-item.active b{color:var(--teal);background:rgba(47,214,195,.14)}
.sys-card{margin-top:auto;display:flex;gap:11px;align-items:center;padding:13px;border-radius:12px;background:rgba(61,220,151,.06);border:1px solid rgba(61,220,151,.2)}
.sys-card strong{display:block;font-size:12px;font-weight:600}
.sys-card small{font:500 10px var(--mono);color:var(--faint);letter-spacing:.04em}
.pulse-dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none;animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(61,220,151,.55)}70%{box-shadow:0 0 0 9px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:12px 26px;border-bottom:1px solid var(--line);background:rgba(8,14,26,.72);backdrop-filter:blur(14px) saturate(1.3);direction:ltr}
.top-right{margin-left:auto;display:flex;align-items:center;gap:11px}
.panel-badge{display:none;align-items:center;gap:8px;font:600 11px var(--mono);letter-spacing:.16em;color:var(--teal);border:1px solid rgba(47,214,195,.35);background:rgba(47,214,195,.08);padding:7px 12px;border-radius:8px;white-space:nowrap}
.panel-badge i{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);animation:blink 2.2s infinite}
.panel-badge small{font-size:.62em;opacity:.7;font-weight:500;letter-spacing:.05em;margin-left:3px}
.lang-toggle{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--mono);letter-spacing:.14em;color:var(--ink);background:rgba(126,156,198,.08);border:1px solid var(--line2);padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:color .2s,border-color .2s,background .2s,transform .15s}
.lang-toggle:hover{color:var(--teal);border-color:rgba(47,214,195,.45);background:rgba(47,214,195,.06)}
.lang-toggle:active{transform:translateY(1px) scale(.97)}
.lang-toggle .globe{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}


/* ---------- page ---------- */
main{min-width:0}
.page{padding:22px 26px 46px;max-width:1240px;margin:0 auto;width:100%}
.crumbs{font:500 11px var(--mono);letter-spacing:.08em;color:var(--faint)}
.crumbs span{margin:0 6px;opacity:.5}
.crumbs em{font-style:normal;color:var(--teal)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:8px;flex-wrap:wrap}
h1{font:700 36px/1.05 var(--disp);letter-spacing:.01em}
.live-line{display:flex;align-items:center;gap:8px;margin-top:9px;font:500 11.5px var(--mono);color:var(--mut);letter-spacing:.05em;flex-wrap:wrap}
.live-line i{opacity:.4}
.live-line b{color:var(--ink);font-weight:600}
.live-tag{display:inline-flex;align-items:center;gap:6px;color:var(--red);font-weight:700;letter-spacing:.14em}
.live-tag::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 9px var(--red);animation:blink 1.6s infinite}
.head-actions{display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 12.5px var(--body);padding:9px 15px;border-radius:9px;cursor:pointer;border:1px solid transparent;transition:transform .15s,box-shadow .2s,background .2s,border-color .2s,color .2s}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.primary{background:linear-gradient(135deg,#2fd6c3,#18b5a3);color:#04231f;box-shadow:0 4px 18px rgba(47,214,195,.28)}
.btn.primary:hover{box-shadow:0 6px 28px rgba(47,214,195,.45);transform:translateY(-1px)}
.btn.ghost{background:rgba(126,156,198,.06);border-color:var(--line2);color:var(--ink)}
.btn.ghost:hover{border-color:rgba(47,214,195,.45);color:var(--teal)}
.scanner-head-actions{display:flex;gap:8px;align-items:stretch;width:100%;max-width:520px}
.scanner-head-actions .btn{flex:1 1 0;justify-content:center;white-space:nowrap;padding:10px 12px}
.sc-send-wide{flex:2 1 0!important;background:rgba(47,214,195,.08)!important;border-color:rgba(47,214,195,.4)!important;color:var(--teal)!important}
.sc-send-wide:hover{background:rgba(47,214,195,.16)!important;border-color:rgba(47,214,195,.7)!important}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.stat{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px 10px;transition:transform .2s,border-color .2s}
.stat::after{content:'';position:absolute;inset:0;background:radial-gradient(260px 130px at 88% -10%,var(--tint,rgba(47,214,195,.09)),transparent 70%);pointer-events:none}
.stat:hover{transform:translateY(-3px);border-color:var(--line2)}
.stat header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.delta{font:600 10.5px var(--mono);color:var(--green);background:rgba(61,220,151,.1);padding:3px 8px;border-radius:20px;flex:none}
.stat-v{display:block;font:700 30px/1.15 var(--disp);margin:10px 0 2px}
.stat-v em{font:600 14px var(--mono);font-style:normal;color:var(--mut);margin-left:4px}
.spark{width:100%;height:38px;display:block}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-top:16px;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-head h2{font:600 16px var(--disp);letter-spacing:.02em}
.info-btn{width:19px;height:19px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;font:700 11px var(--disp);color:var(--faint);background:rgba(126,156,198,.1);border:1px solid var(--line2);cursor:pointer;transition:color .2s,border-color .2s,background .2s,box-shadow .2s,transform .15s;line-height:1;margin-left:6px;vertical-align:2px;position:relative}
.info-btn:hover{color:var(--teal);border-color:rgba(47,214,195,.5);background:rgba(47,214,195,.12);box-shadow:0 0 10px rgba(47,214,195,.35);transform:scale(1.12)}
.info-btn:active{transform:scale(.92)}
[dir="rtl"] .info-btn{margin-left:0;margin-right:6px}
.info-desc{font:500 13px var(--body);color:var(--mut);line-height:1.85;margin:4px 0 2px}
.info-fields{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:7px}
.if-row{display:flex;gap:10px;align-items:baseline}
.if-k{font:600 10.5px var(--mono);color:var(--teal);letter-spacing:.05em;flex:0 0 auto;min-width:72px;white-space:nowrap}
.if-v{font:500 12.5px var(--body);color:var(--mut);line-height:1.6}
.modal-body{overflow-y:auto;min-height:0;max-height:70vh;padding:12px 20px 18px}
.sub{display:block;font:500 10.5px var(--mono);color:var(--faint);letter-spacing:.1em;margin-top:3px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-left:auto}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.sw.in{background:var(--teal);box-shadow:0 0 8px rgba(47,214,195,.6)}
.sw.out{background:var(--blue);box-shadow:0 0 8px rgba(84,169,255,.5)}
.tabs{display:flex;background:rgba(126,156,198,.08);border:1px solid var(--line);border-radius:9px;padding:3px}
.tabs button{font:600 11px var(--mono);letter-spacing:.06em;color:var(--mut);background:none;border:0;padding:6px 12px;border-radius:6px;cursor:pointer;transition:color .2s,background .2s}
.tabs button.on{background:rgba(47,214,195,.16);color:var(--teal)}
.tabs button:hover:not(.on){color:var(--ink)}
.link{margin-left:auto;font:600 12px var(--body);color:var(--teal);text-decoration:none;transition:letter-spacing .2s}
.link:hover{letter-spacing:.04em}

/* ---------- chart ---------- */
.chart-wrap{position:relative;padding:10px 6px 0}
#chart{width:100%;height:300px;display:block;cursor:crosshair}
#chart text{font:500 10px var(--mono);fill:var(--faint)}
.gridline{stroke:rgba(126,156,198,.1);stroke-dasharray:3 5}
#lineIn{fill:none;stroke:var(--teal);stroke-width:2.2;filter:drop-shadow(0 0 6px rgba(47,214,195,.4))}
#lineOut{fill:none;stroke:var(--blue);stroke-width:2;filter:drop-shadow(0 0 6px rgba(84,169,255,.3))}
#hoverG{opacity:0;transition:opacity .15s}
#xh{stroke:rgba(232,238,248,.28);stroke-dasharray:3 4}
#dIn{fill:var(--bg);stroke:var(--teal);stroke-width:2}
#dOut{fill:var(--bg);stroke:var(--blue);stroke-width:2}
.tip{position:absolute;pointer-events:none;display:flex;flex-direction:column;gap:3px;background:rgba(10,18,32,.95);border:1px solid var(--line2);border-radius:9px;padding:8px 11px;font:500 11px var(--mono);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;white-space:nowrap;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.tip b{color:var(--ink);margin-bottom:2px}
.tip .ti{color:var(--teal)} .tip .to{color:var(--blue)}
.chart-empty{position:absolute;inset:0;place-items:center;padding:20px;color:var(--faint);font:500 12px var(--mono);letter-spacing:.04em;text-align:center;pointer-events:none;z-index:2}
.chart-stats{display:flex;gap:26px;padding:12px 20px 16px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.chart-stats b{font:600 13px var(--mono);color:var(--ink);margin-left:6px}
#peakV{color:var(--teal)} #avgV{color:var(--blue)} #p95V{color:var(--amber)}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
thead th{text-align:left;font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:11px 16px;border-bottom:1px solid rgba(126,156,198,.07);white-space:nowrap}
tbody tr{transition:background .15s;cursor:pointer}
tbody tr:hover{background:rgba(126,156,198,.05)}
tbody tr.sel{background:rgba(47,214,195,.07);outline:1px solid rgba(47,214,195,.35);outline-offset:-1px}
tbody tr.hit{animation:rowhit .7s ease}
@keyframes rowhit{0%{background:rgba(47,214,195,.22)}100%{background:rgba(47,214,195,.07)}}
tbody tr:last-child td{border-bottom:0}
.u{display:flex;align-items:center;gap:11px}
.av{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font:700 10.5px var(--disp);color:#08131f;background:hsl(var(--h) 72% 64%);flex:none}
.u-t b{display:block;font-size:13px;font-weight:600}
.u-t small{color:var(--faint);font-size:11px}
.plan{font:600 10px var(--mono);letter-spacing:.08em;padding:3.5px 9px;border-radius:6px}
.plan.pro{color:var(--teal);background:rgba(47,214,195,.1);border:1px solid rgba(47,214,195,.3)}
.plan.enterprise{color:var(--blue);background:rgba(84,169,255,.1);border:1px solid rgba(84,169,255,.3)}
.plan.starter{color:var(--mut);background:rgba(126,156,198,.08);border:1px solid var(--line2)}
.usage{display:inline-block;width:74px;height:5px;border-radius:4px;background:rgba(126,156,198,.14);overflow:hidden;vertical-align:middle;margin-right:9px}
.usage i{display:block;height:100%;width:var(--w);border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--blue))}
td small.mono{font:500 11.5px var(--mono);color:var(--mut)}
.mono-cell{font:500 12px var(--mono);color:var(--mut)}
.st{font:600 11px var(--mono);padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:6px}
.st::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.st.active{color:var(--green);background:rgba(61,220,151,.1)}
.st.trial{color:var(--amber);background:rgba(255,180,84,.1)}
.st.suspended{color:var(--red);background:rgba(255,107,122,.1)}
.empty{ text-align:center;color:var(--faint);padding:22px!important;font-size:12.5px}

/* ---------- modules ---------- */
.modules{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.module{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;overflow:hidden;transition:transform .2s,border-color .25s;scroll-margin-top:90px}
.module:hover{transform:translateY(-4px);border-color:rgba(47,214,195,.4)}
.m-ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:rgba(126,156,198,.08);border:1px solid var(--line);color:var(--mut);margin-bottom:12px;transition:color .25s,border-color .25s,box-shadow .25s}
.m-ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.module:hover .m-ico{color:var(--teal);border-color:rgba(47,214,195,.4);box-shadow:0 0 16px rgba(47,214,195,.2)}
.m-tag{font:600 9.5px var(--mono);letter-spacing:.16em;color:var(--amber);background:rgba(255,180,84,.09);border:1px solid rgba(255,180,84,.25);padding:3px 8px;border-radius:5px}
.module h3{font:600 15.5px var(--disp);margin:10px 0 6px}
.module p{font-size:12px;color:var(--mut);line-height:1.55}
.module code{display:block;margin-top:12px;font:500 11px var(--mono);color:var(--faint)}
.module code::after{content:'▍';color:var(--teal);animation:blink 1.1s steps(1) infinite;margin-left:2px}
.shimmer{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(126,156,198,.12);overflow:hidden}
.shimmer::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(47,214,195,.7),transparent);transform:translateX(-100%);animation:shim 2.8s ease-in-out infinite}
.stat .shimmer{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(126,156,198,.12);overflow:hidden}
.stat .shimmer::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--sh-col,rgba(47,214,195,.7)),transparent);transform:translateX(-100%);animation:shim 2.8s ease-in-out infinite}
@keyframes shim{to{transform:translateX(100%)}}
.module.flash{animation:flashB 1.2s ease}
@keyframes flashB{0%,55%{border-color:rgba(47,214,195,.85);box-shadow:0 0 0 3px rgba(47,214,195,.16)}100%{}}

/* ---------- footer ---------- */
.foot{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint)}
.foot .mono{font-family:var(--mono);color:var(--mut)}
.foot .keys{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--mono)}

/* ---------- glass bottom nav (mobile) ---------- */
.mobilenav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:none;grid-template-columns:repeat(5,1fr);gap:2px;padding:7px;border-radius:20px;
  background:rgba(12,20,36,.58);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
  border:1px solid rgba(148,180,220,.18);
  box-shadow:0 14px 44px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.09);z-index:60}
.mn-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 7px;border-radius:13px;color:var(--mut);font:500 9.5px var(--body);letter-spacing:.03em;background:none;border:0;cursor:pointer;position:relative;transition:color .2s,background .2s;-webkit-tap-highlight-color:transparent}
.mn-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.mn-item.active{color:var(--teal);background:rgba(47,214,195,.13)}
.mn-item.active::after{content:'';position:absolute;top:4px;right:calc(50% - 15px);width:4px;height:4px;border-radius:50%;background:var(--teal);box-shadow:0 0 6px var(--teal)}
.mn-item:active svg{transform:scale(.86)}

/* ---------- toasts ---------- */

/* ---------- مودال تأیید سفارشی (به‌جای confirm مرورگر) ---------- */
function customConfirm(message){
  return new Promise(resolve=>{
    let veil = $('cfmVeil');
    if(veil) veil.remove();
    const holder = document.createElement('div');
    holder.innerHTML = `<div class="modal-veil" id="cfmVeil">
      <div class="modal" style="width:min(400px,calc(100vw - 32px))">
        <div class="modal-body">
          <p class="info-desc" style="margin:0 0 6px">${message}</p>
          <div class="form-actions" style="padding:10px 0 0">
            <button class="btn ghost danger" id="cfmYes" type="button">${tr('users.delbtn')}</button>
            <button class="btn primary" id="cfmNo" type="button">${tr('users.cancel')}</button>
          </div>
        </div>
      </div>
    </div>`;
    document.body.appendChild(holder.firstElementChild);
    veil = $('cfmVeil');
    veil.classList.add('show');
    const close = (val)=>{ veil.remove(); resolve(val); };
    $('cfmYes').onclick = ()=>close(true);
    $('cfmNo').onclick = ()=>close(false);
    veil.addEventListener('click', e=>{ if(e.target===veil) close(false); });
  });
}

<script>
const PANEL_VERSION='1.2.5';
/* single source of truth — keeps every version badge on the page in sync */
document.querySelectorAll('[data-version]').forEach(el=>{ el.textContent = PANEL_VERSION; });
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);

/* ---------- page teardown registry ---------- */
let teardowns = [];
function addTeardown(fn){ teardowns.push(fn); }
function runTeardowns(){ for(const fn of teardowns){ try{ fn(); }catch(e){} } teardowns = []; }

/* ---------- count-up stats ---------- */
function countUp(el, to, dec=0){
  if(reduced){ el.textContent = to.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}); return; }
  const t0 = performance.now(), dur = 1400;
  (function f(t){
    const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
    el.textContent = (to*e).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
    if(p<1) requestAnimationFrame(f);
  })(t0);
}

/* ---------- smooth path helper ---------- */
function smooth(p){
  if(p.length<2) return '';
  let d = `M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
  for(let i=1;i<p.length;i++){
    /* c باید برای آخرین نقطه به خود b محدود شود (باگ قبلی: c=p[i+1] در i آخر undefined بود و نمودار رسم نمی‌شد) */
    const a=p[i-1], b=p[i], c=p[Math.min(p.length-1,i+1)], e=p[Math.min(p.length-1,i+2)];
    d += `C${(b[0]+(c[0]-a[0])/6).toFixed(1)},${(b[1]+(c[1]-a[1])/6).toFixed(1)},${(c[0]-(e[0]-b[0])/6).toFixed(1)},${(c[1]-(e[1]-b[1])/6).toFixed(1)},${c[0].toFixed(1)},${c[1].toFixed(1)}`;
  }
  return d;
}
function series(n, base, amp, seed){
  const a=[];
  for(let i=0;i<n;i++){
    const t=i/n;
    const w = .5*Math.sin(t*6.283*1.6+seed) + .3*Math.sin(t*6.283*3.7+seed*1.9) + .2*Math.sin(t*6.283*7.9+seed*3.1);
    a.push(Math.max(.2, base + amp*w + (Math.random()-.5)*amp*.14));
  }
  return a;
}

/* ---------- toasts (global) ---------- */
function toast(msg, color){
  const t=document.createElement('div'); t.className='toast';
  t.innerHTML=`<i style="background:${color||'var(--teal)'}"></i>${msg}`;
  $('toasts').appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),320); }, 3200);
}

/* ---------- API client (auth-aware) ---------- */
let _sessionToken = null;
let _adminPassChanged = false;
function getToken(){
  if(_sessionToken) return _sessionToken;
  try{
    const m = (document.cookie||'').split(';').find(c=>c.trim().startsWith('auth='));
    if(m) _sessionToken = m.split('=')[1];
  }catch(e){}
  return _sessionToken;
}
let _adminPrefix = '';
function setAdminPrefix(p){ _adminPrefix = p || ''; }
function apiPath(path){
  return _adminPrefix ? (_adminPrefix + path) : path;
}
/* تشخیص خودکار مسیر مخفی از آدرس فعلی (مثلاً /abc123) */
(function detectAdminPrefix(){
  try{
    const seg = (location.pathname || '/').split('/').filter(Boolean)[0];
    if(seg && seg !== 'admin' && seg !== 'login' && !seg.startsWith('api')){
      _adminPrefix = '/' + seg;
    }
  }catch(e){}
})();
async function api(path, opts = {}){
  opts.headers = Object.assign({ 'Content-Type':'application/json' }, opts.headers||{});
  if(opts.body && typeof opts.body !== 'string') opts.body = JSON.stringify(opts.body);
  let res;
  try{ res = await fetch(apiPath(path), { credentials:'same-origin', ...opts }); }
  catch(e){ throw new Error('NETWORK'); }
  if(res.status === 401){
    await showLoginModal();
    throw new Error('UNAUTHORIZED');
  }
  let data = null, isJson = true;
  try{ data = await res.json(); }catch(e){ isJson = false; }
  if(!res.ok){ throw new Error((data && data.error) || ('HTTP ' + res.status)); }
  if(!isJson){ throw new Error('NOT_API'); }
  return data;
}
/* پیام خطای خوانا برای کاربر — تا دلیل واقعی پنهان نماند */
function errMsg(e){
  const m = (e && e.message) || '';
  if(m === 'UNAUTHORIZED') return '';
  if(m === 'NETWORK') return tr('err.network');
  if(m === 'NOT_API') return tr('err.notapi');
  if(/^HTTP /.test(m)) return tr('err.http') + ' ' + m;
  return m || tr('users.operr');
}

/* ---------- dropdown سفارشی (جایگزین select استاندارد) ---------- */
function initCustomSelect(sel){
  if(!sel || sel.dataset.csel) return;
  sel.style.display = 'none';
  sel.dataset.csel = '1';
  const wrap = document.createElement('div');
  wrap.className = 'csel';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'csel-btn';
  btn.innerHTML = '<span class="csel-val"></span><svg class="chev" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>';
  const menu = document.createElement('div');
  menu.className = 'csel-menu';
  const paint = () => {
    const val = btn.querySelector('.csel-val');
    val.textContent = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent : '';
    menu.querySelectorAll('.csel-opt').forEach(o => o.classList.toggle('on', o.dataset.v === sel.value));
  };
  const close = () => wrap.classList.remove('open');
  const open = () => wrap.classList.add('open');
  const rebuild = () => {
    menu.innerHTML = '';
    [...sel.options].forEach(opt => {
      const o = document.createElement('button');
      o.type = 'button';
      o.className = 'csel-opt';
      o.dataset.v = opt.value;
      o.textContent = opt.textContent;
      o.addEventListener('click', e => {
        e.stopPropagation();
        sel.value = opt.value;
        sel.dispatchEvent(new Event('change', { bubbles:true }));
        paint();
        close();
      });
      menu.appendChild(o);
    });
    paint();
  };
  const onDoc = e => { if(!wrap.contains(e.target)) close(); };
  btn.addEventListener('click', e => { e.stopPropagation(); wrap.classList.contains('open') ? close() : open(); });
  document.addEventListener('click', onDoc);
  sel.addEventListener('change', paint);
  wrap.appendChild(btn);
  wrap.appendChild(menu);
  sel.parentNode.insertBefore(wrap, sel.nextSibling);
  rebuild();
  sel._cselPaint = paint;
  addTeardown(() => { document.removeEventListener('click', onDoc); });
}
function refreshCustomSelects(){
  document.querySelectorAll('select.f-in').forEach(s => { if(s._cselPaint) s._cselPaint(); });
}

/* ---------- راهنمای قابلیت‌ها (دکمه !) ---------- */
function showInfo(key){
  const title = tr('info.' + key + '.t');
  const desc = tr('info.' + key + '.d');
  /* توضیح ساده فیلدهای داخلی (لیست) */
  const fields = [];
  (tr('info.' + key + '.fields') || '').split('\n').forEach(line=>{
    const i = line.indexOf('=');
    if(i > 0) fields.push({ k: line.slice(0,i), v: line.slice(i+1) });
  });
  let veil = $('infoVeil');
  if(veil) veil.remove();
  const holder = document.createElement('div');
  holder.innerHTML = `<div class="modal-veil" id="infoVeil">
    <div class="modal" style="width:min(470px,calc(100vw - 32px))">
      <div class="modal-head"><h2>${title}</h2><button class="modal-x" id="infoX" type="button" aria-label="Close">×</button></div>
      <div class="modal-body">
        <p class="info-desc">${desc}</p>
        ${fields.length ? '<div class="info-fields">' + fields.map(f=>'<div class="if-row"><span class="if-k">' + f.k + '</span><span class="if-v">' + f.v + '</span></div>').join('') + '</div>' : ''}
        <div class="form-actions" style="padding:10px 0 0"><button class="btn primary" id="infoOk" type="button">${tr('info.ok')}</button></div>
      </div>
    </div>
  </div>`;
  document.body.appendChild(holder.firstElementChild);
  veil = $('infoVeil');
  veil.classList.add('show');
  const close = ()=>{ veil.remove(); document.removeEventListener('keydown', esc); };
  const esc = e=>{ if(e.key==='Escape') close(); };
  document.addEventListener('keydown', esc);
  veil.addEventListener('click', e=>{ if(e.target===veil) close(); });
  $('infoX').onclick = close;
  $('infoOk').onclick = close;
}
/* لینستنر سراسری — همه دکمه‌های ! را مدیریت می‌کند */
document.addEventListener('click', e=>{
  const b = e.target.closest('.info-btn');
  if(!b) return;
  e.preventDefault();
  e.stopPropagation();
  showInfo(b.dataset.info);
});

/* ---------- login modal ---------- */
function loginModalHtml(){
  /* اگر رمز پیش‌فرض باشد، «رمز عبور» نمایش داده می‌شود — بعد از تغییر رمز دیگر نمایش داده نمی‌شود */
  const showDefault = !_adminPassChanged;
  return `<div class="modal-veil" id="loginVeil">
    <div class="modal">
      <div class="modal-head">
        <h2>RAHIN</h2>
      </div>
      <div class="modal-body">
        <div class="sub" data-i18n="login.sub">Admin sign-in required</div>
        ${showDefault ? '<div class="login-hint" data-i18n="login.hint">Password: rahin-admin-XXXX (from deployer)</div>' : ''}
        <div class="f-field">
          <label for="loginPass" data-i18n="login.password">Admin password</label>
          <input class="f-in" id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••">
        </div>
        <div class="modal-err" id="loginErr"></div>
        <div class="form-actions">
          <button class="btn primary" id="loginBtn" type="button"><svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg><span data-i18n="login.btn">Sign in</span></button>
        </div>
      </div>
    </div>
  </div>`;
}
function showLoginModal(){
  return new Promise(resolve=>{
    let veil = $('loginVeil');
    if(!veil){
      const holder = document.createElement('div');
      holder.innerHTML = loginModalHtml();
      document.body.appendChild(holder.firstElementChild);
      veil = $('loginVeil');
    }
    veil.classList.add('show');
    const pass = $('loginPass'); if(pass) setTimeout(()=>pass.focus(), 60);
    const err = $('loginErr');
    /* این مودال فقط با رمز درست بسته می‌شود — بدون ضربدر، Esc یا کلیک بیرون */
    const close = ()=>{ veil.classList.remove('show'); };
    const doLogin = async ()=>{
      err.textContent = '';
      try{
        const d = await api('/api/auth/login', { method:'POST', body:{ password: pass.value } });
        _sessionToken = d.token;
        close();
        resolve(true);
      }catch(e){
        err.textContent = e.message === 'NETWORK' ? tr('login.net') : tr('login.bad');
        if(pass) pass.select();
      }
    };
    const btn = $('loginBtn'); if(btn) btn.onclick = doLogin;
    pass.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  });
}

/* ---------- scroll reveal (per page) ---------- */
function setupReveal(){
  const io=new IntersectionObserver(es=>es.forEach(x=>{ if(x.isIntersecting){ x.target.classList.add('in'); io.unobserve(x.target); } }),{threshold:.12});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
  addTeardown(()=>io.disconnect());
}

const I18N = {

})();
function tr(key){
  return (I18N[currentLang] && I18N[currentLang][key]) || (I18N.en[key] != null ? I18N.en[key] : key);
}
function applyTranslations(){
  const root = document.documentElement;
  root.lang = currentLang;
  root.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{

      /* فقط متن را عوض کن؛ span/دکمه‌های داخلی (مثل راهنما) دست‌نخورده بمانند */

/* ============ PAGE INIT: Overview ============ */
function overviewInit(){
  /* live Tehran clock */
  if($('clock')){
    const clockEl = $('clock');
    const tickClock = () => {
      try {
        clockEl.textContent = new Intl.DateTimeFormat('en-GB', {
          timeZone: 'Asia/Tehran',
          hour12: false,
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        }).format(new Date());
      } catch(e) {
        const now = new Date();
        const tehran = new Date(now.getTime() + (3.5 * 60 * 60 * 1000));
        const hh = String(tehran.getUTCHours()).padStart(2,'0');
        const mm = String(tehran.getUTCMinutes()).padStart(2,'0');
        const ss = String(tehran.getUTCSeconds()).padStart(2,'0');
        clockEl.textContent = `${hh}:${mm}:${ss}`;
      }
    };
    tickClock();
    const clockId = setInterval(tickClock, 1000);
    addTeardown(()=>clearInterval(clockId));
  }

  /* ---------- داده‌های واقعی از بک‌اند ---------- */
  let realChartData = null;   // [{date, in(GB), out(GB), total(GB)}]
  let chartTab = '7D';
  const GB = 1073741824;

  function fmtGB(v){
    if(v >= 1024) return (v/1024).toFixed(2) + ' TB';
    return (v).toFixed(2) + ' GB';
  }

  /* کارت‌های آمار */
  async function loadStats(){
    const d = await api('/api/stats', {method:'GET'});
    const s = d.stats;
    if($('s1')) countUp($('s1'), s.users.active||0);
    if($('d1')) $('d1').textContent = '● ' + (s.users.total||0) + ' ' + tr('ov.totallabel');
    if($('s2')) countUp($('s2'), parseFloat(s.traffic.dailyGB)||0, 2);
    if($('s2u')) $('s2u').textContent = 'GB';
    if($('d2')) $('d2').textContent = (s.traffic.totalGB||'0') + ' ' + tr('ov.alltime');
    if($('s3')) countUp($('s3'), s.requests.today||0);
    if($('d3')) $('d3').textContent = (s.requests.total||0) + ' ' + tr('ov.alltime');
  }

  /* کاربران اخیر */
  async function loadUsers(){
    const d = await api('/api/users', {method:'GET'});
    const users = (d.users||[]).slice().sort((a,b)=> String(b.created||'').localeCompare(String(a.created||'')));
    renderOverviewUsers(users);
  }
  function renderOverviewUsers(users){
    const tb = $('tbody'); if(!tb) return;
    if(!users.length){ tb.innerHTML = `<tr><td colspan="5" class="empty">${tr('ov.nousers')}</td></tr>`; return; }
    tb.innerHTML = users.slice(0,6).map(u=>{
      const st = u.status || 'active';
      const stKey = USER_STATUS_KEYS[st] || USER_STATUS_KEYS.active;
      const initials = (u.name||'?').split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase();
      const hue = (parseInt(u.id||'0',36) % 360) || 165;
      const totalGB = u.quotaBytes ? ((u.usage.totalBytes||0)/GB).toFixed(1)+' / '+(u.quotaBytes/GB).toFixed(0)+' GB' : fmtBytes(u.usage.totalBytes||0);
      const pct = u.quotaBytes ? Math.min(100, Math.round(((u.usage.totalBytes||0)/u.quotaBytes)*100)) : 0;
      return `<tr data-sub="${escapeHtml(u.subscriptionUrl||'')}">
        <td><span class="u"><i class="av" style="--h:${hue}">${escapeHtml(initials)}</i><span class="u-t"><b>${escapeHtml(u.name||'')}</b><small>${escapeHtml(u.username||'')}${u.userIps&&u.userIps.length?' · '+u.userIps.length+' IP':''}${u.userProxyIps&&u.userProxyIps.length?' · '+u.userProxyIps.length+' PX':''}</small></span></span></td>
        <td class="mono-cell">${escapeHtml(u.tag||'—')}</td>
        <td>${u.quotaBytes?`<span class="usage"><i style="--w:${pct}%"></i></span><small class="mono">${totalGB}</small>`:fmtBytes(u.usage.totalBytes||0)}</td>
        <td><span class="st ${st}">${tr(stKey)}</span></td>
        <td class="mono-cell">${fmtDate(u.created)}</td>
      </tr>`;
    }).join('');
  }

  /* نمودار ترافیک واقعی (مصرف روزانه از D1) */
  async function loadChart(){
    const d = await api('/api/stats/usage?days=90', {method:'GET'});
    realChartData = (d.series||[]).map(o=>({
      date: o.date,
      in: (o.down||0)/GB,
      out: (o.up||0)/GB,
      total: (o.total||0)/GB
    }));
    renderChart(false);
  }

  const svg=$('chart'), wrap=$('chartWrap'), tip=$('tip'),
        gridY=$('gridY'), labels=$('labels'),
        lineIn=$('lineIn'), lineOut=$('lineOut'),
        areaIn=$('areaIn'), areaOut=$('areaOut'),
        hoverG=$('hoverG'), xh=$('xh'), dIn=$('dIn'), dOut=$('dOut'),
        peakV=$('peakV'), avgV=$('avgV'), p95V=$('p95V'), subUnit=$('subUnit');
  const H=300, P={l:46,r:16,t:16,b:28};
  let W=800, pI=[], pO=[];

  function renderChart(anim){
    if(!svg) return;
    const emptyEl=$('chartEmpty'), emptyTxt=$('chartEmptyTxt');
    const hasData = realChartData && realChartData.length && realChartData.some(o=>o.total>0);
    if(!hasData){
      if(emptyTxt) emptyTxt.textContent = tr('ov.nodata');
      if(emptyEl) emptyEl.style.display = 'grid';
      gridY.innerHTML=''; labels.innerHTML='';
      lineIn.setAttribute('d',''); lineOut.setAttribute('d','');
      areaIn.setAttribute('d',''); areaOut.setAttribute('d','');
      if(peakV) peakV.textContent='—'; if(avgV) avgV.textContent='—'; if(p95V) p95V.textContent='—';
      if(subUnit) subUnit.textContent='GB · '+chartTab;
      return;
    }
    if(emptyEl) emptyEl.style.display='none';
    const n = {7:7,30:30,90:90}[parseInt(chartTab,10)] || 7;
    const data = realChartData.slice(-n);
    const max = Math.max(1, Math.ceil(Math.max(...data.map(o=>o.in+o.out))));
    const X = i => P.l + (W-P.l-P.r) * (n===1?0.5:i/(n-1));
    const Y = v => P.t + (H-P.t-P.b) * (1 - v/max);
    let g='', lab='';
    for(let f=1;f<=4;f++){
      const v=max*f/4, y=Y(v);
      g += `<line class="gridline" x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}"/>`;
      lab += `<text x="${P.l-8}" y="${y+3}" text-anchor="end">${v%1?v.toFixed(1):v}</text>`;
    }
    const step = Math.max(1, Math.ceil(n/6));
    for(let i=0;i<n;i+=step){
      const d = data[i].date.split('-');
      const lbl = `${Number(d[1])}/${Number(d[2])}`;
      lab += `<text x="${X(i)}" y="${H-8}" text-anchor="middle">${lbl}</text>`;
    }
    gridY.innerHTML=g; labels.innerHTML=lab;
    pI = data.map((o,i)=>[X(i), Y(o.in)]);
    pO = data.map((o,i)=>[X(i), Y(o.out)]);
    const dI=smooth(pI), dO=smooth(pO);
    const close=`L${X(n-1).toFixed(1)},${H-P.b}L${X(0).toFixed(1)},${H-P.b}Z`;
    lineIn.setAttribute('d',dI);  areaIn.setAttribute('d',dI+close);
    lineOut.setAttribute('d',dO); areaOut.setAttribute('d',dO+close);
    const tot = data.reduce((a,o)=>a+o.total,0);
    if(peakV) peakV.textContent = fmtGB(tot);
    if(avgV) avgV.textContent = fmtGB(tot/data.length);
    const peakDay = data.reduce((a,o)=> o.total>a.total ? o : a, data[0]);
    if(p95V) p95V.textContent = peakDay.date + ' · ' + fmtGB(peakDay.total);
    if(subUnit) subUnit.textContent='GB · '+chartTab;
    if(anim && !reduced && lineIn.getTotalLength){ drawAnim(lineIn); drawAnim(lineOut); fadeArea(); }
  }
  function drawAnim(p){
    try{
      const L=p.getTotalLength();
      p.style.transition='none'; p.style.strokeDasharray=L; p.style.strokeDashoffset=L;
      p.getBoundingClientRect();
      p.style.transition='stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1)'; p.style.strokeDashoffset=0;
      setTimeout(()=>p.style.strokeDasharray='none', 1250);
    }catch(e){}
  }
  function fadeArea(){
    [areaIn,areaOut].forEach(a=>{ a.style.transition='none'; a.style.opacity=0; a.getBoundingClientRect();
      a.style.transition='opacity .9s ease .25s'; a.style.opacity=1; });
  }
  function sizeChart(){
    W=Math.max(320, svg.clientWidth||wrap.clientWidth);
    svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
    renderChart(false);
  }
  if(svg){
    requestAnimationFrame(sizeChart);
    let rt; const resizeHandler=()=>{ clearTimeout(rt); rt=setTimeout(sizeChart,160); };
    addEventListener('resize', resizeHandler);
    addTeardown(()=>removeEventListener('resize', resizeHandler));

    const tabsEl=$('tabs');
    if(tabsEl){
      tabsEl.addEventListener('click', e=>{
        const b=e.target.closest('button'); if(!b || b.dataset.t===chartTab) return;
        tabsEl.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
        chartTab=b.dataset.t; renderChart(true);
      });
    }

    svg.addEventListener('pointermove', e=>{
      if(!pI.length) return;
      const r=svg.getBoundingClientRect();
      const px=(e.clientX-r.left)*(W/r.width);
      const n=pI.length;
      let i=Math.round((px-P.l)/(W-P.l-P.r)*(n-1));
      i=Math.max(0, Math.min(n-1, i));
      const xi=pI[i][0];
      xh.setAttribute('x1',xi); xh.setAttribute('x2',xi);
      dIn.setAttribute('cx',xi);  dIn.setAttribute('cy',pI[i][1]);
      dOut.setAttribute('cx',xi); dOut.setAttribute('cy',pO[i][1]);
      hoverG.style.opacity=1;
      const win = realChartData.slice(-({7:7,30:30,90:90}[parseInt(chartTab,10)]||7));
      tip.innerHTML=`<b>${win[i].date}</b><span class="ti">▲ ${fmtGB(win[i].in)}</span><span class="to">▼ ${fmtGB(win[i].out)}</span>`;
      const wr=wrap.getBoundingClientRect();
      let tx=e.clientX-wr.left+16, ty=e.clientY-wr.top-14;
      if(tx>wr.width-150) tx-=172;
      tip.style.left=tx+'px'; tip.style.top=ty+'px'; tip.style.opacity=1;
    });
    svg.addEventListener('pointerleave', ()=>{ hoverG.style.opacity=0; tip.style.opacity=0; });
  }

  /* خروجی واقعی (اسنپ‌شات JSON) */
  async function doExport(){
    try{
      const [u, c] = await Promise.all([
        api('/api/users', {method:'GET'}),
        api('/api/config', {method:'GET'})
      ]);
      const snap = { exportedAt:new Date().toISOString(), version:PANEL_VERSION, users:(u.users||[]), config:c.config||null };
      const blob = new Blob([JSON.stringify(snap,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'rahin-snapshot-' + new Date().toISOString().slice(0,10) + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
      toast(tr('toast.export'), '#54a9ff');
    }catch(e){ toast(tr('users.operr'), '#ff6b7a'); }
  }

  /* بارگذاری همه با retry بعد از ورود */
  (async function loadAll(attempt){
    try{
      await Promise.all([loadStats(), loadUsers(), loadChart()]);
    }catch(e){
      if(e && e.message === 'UNAUTHORIZED' && attempt < 3){
        await new Promise(r=>setTimeout(r,150));
        await loadAll(attempt+1);
      }
    }
  })(0);

  const deployBtn=$('deployBtn');
  if(deployBtn) deployBtn.addEventListener('click', ()=>toast(tr('toast.deploy')));
  const exportBtn=$('exportBtn');
  if(exportBtn) exportBtn.addEventListener('click', doExport);

  /* ناوبری کیبورد جدول (با delegation — ردیف‌ها بعد از fetch ساخته می‌شوند) */
  const getRows = ()=>[...document.querySelectorAll('#tbody tr:not(.loading-row):not(.empty)')];
  const keyHandler=(e)=>{
    const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if(typing){ if(e.key==='Escape') document.activeElement.blur(); return; }
    const rows=getRows();
    let sel=rows.findIndex(r=>r.classList.contains('sel'));
    if(e.key==='ArrowDown'){ e.preventDefault(); sel=Math.min(rows.length-1, sel+1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(0, sel-1); }
    else if(e.key==='Enter' && sel>-1 && rows[sel]){
      const r=rows[sel];
      r.classList.remove('hit'); void r.offsetWidth; r.classList.add('hit');
      const sub=r.dataset.sub;
      if(sub){
        const full=location.origin+sub;
        try{ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(full); else { const ta=document.createElement('textarea'); ta.value=full; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } toast(tr('users.copied'), '#3ddc97'); }catch(e2){ toast(tr('users.copyerr'), '#ff6b7a'); }
      }
      return;
    }
    else if(e.key==='Escape'){ sel=-1; }
    else return;
    rows.forEach((r,i)=>r.classList.toggle('sel', i===sel));
    if(sel>-1 && rows[sel]) rows[sel].scrollIntoView({block:'nearest'});
  };
  document.addEventListener('keydown', keyHandler);
  addTeardown(()=>document.removeEventListener('keydown', keyHandler));

  /* reveal */
  setupReveal();
}

/* ============ PAGE INIT: Configs ============ */
/* تنظیمات کلی کانفیگ — ذخیره در KV از طریق /api/config */
const CFG_FIELDS = ['HOST','UUID','PATH','sugProtokol','protokolHaavara','gRPCmode','dalegImutTeuda','pilugTLS','Fingerprint'];
function configsInit(){
  setupReveal();

  /* ---------- dropdown های سفارشی (همه select های فرم) ---------- */
  document.querySelectorAll('select.f-in').forEach(initCustomSelect);

  /* ---------- دکمه‌های ساخت/تغییر UUID (با ذخیره مستقیم) ---------- */
  function newUuid(){
    if(crypto && crypto.randomUUID) return crypto.randomUUID();
    /* fallback برای مرورگرهای قدیمی */
    const b = crypto.getRandomValues ? crypto.getRandomValues(new Uint8Array(16)) : Array.from({length:16},()=>Math.floor(Math.random()*256));
    b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
    const h = Array.from(b, x=>x.toString(16).padStart(2,'0')).join('');
    return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
  }
  const uuidIn = $('cfg_UUID'), uuidGen = $('uuidGenBtn'), uuidRegen = $('uuidRegenBtn');
  async function saveUuid(value){
    const d = await api('/api/config', { method:'GET' });
    const cfg = (d && d.config) || {};
    cfg.UUID = value;
    await api('/api/config', { method:'PUT', body: cfg });
  }
  const uuidFlash = el => {
    el.style.borderColor = 'var(--teal)';
    el.style.boxShadow = '0 0 0 3px rgba(47,214,195,.18)';
    setTimeout(()=>{ el.style.borderColor = ''; el.style.boxShadow = ''; }, 1400);
  };
  if(uuidGen) uuidGen.addEventListener('click', async ()=>{
    const v = newUuid();
    uuidIn.value = v;
    uuidFlash(uuidIn);
    try{ await saveUuid(v); toast(tr('page.configs.uuid.saved'), '#3ddc97'); }
    catch(e){ if(e.message !== 'UNAUTHORIZED') toast(tr('users.operr') + ' — ' + errMsg(e), '#ff6b7a'); }
  });
  if(uuidRegen) uuidRegen.addEventListener('click', async ()=>{
    if(!confirm(tr('page.configs.uuid.regenconf'))) return;
    const v = newUuid();
    uuidIn.value = v;
    uuidFlash(uuidIn);
    try{ await saveUuid(v); toast(tr('page.configs.uuid.saved'), '#3ddc97'); }
    catch(e){ if(e.message !== 'UNAUTHORIZED') toast(tr('users.operr') + ' — ' + errMsg(e), '#ff6b7a'); }
  });

  /* ---------- نوار گروه‌ها (مثل فولدرهای تلگرام) ---------- */
  const groups = $('cfgGroups');
  if(groups){
    /* انیمیشن نرم ظاهر شدن — کمی تأخیر تا صفحه رندر شود */
    setTimeout(()=>groups.classList.add('show'), 160);

    /* سوییچ بین گروه‌ها */
    const selectGroup = g => {
      document.querySelectorAll('.cfg-group').forEach(b=>b.classList.toggle('on', b.dataset.g===g));
      document.querySelectorAll('[data-cfg-panel]').forEach(p=>{
        if(p.dataset.cfgPanel===g){ p.style.display=''; p.classList.add('in'); }
        else p.style.display='none';
      });
    };
    document.querySelectorAll('.cfg-group').forEach(b=>{
      b.addEventListener('click', ()=>selectGroup(b.dataset.g));
    });
    /* ذخیره آخرین گروه انتخاب‌شده */
    try{
      const saved = localStorage.getItem('rahin-cfg-group');
      if(saved && saved!=='general') selectGroup(saved);
    }catch(e){}
    document.querySelectorAll('.cfg-group').forEach(b=>{
      b.addEventListener('click', ()=>{
        try{ localStorage.setItem('rahin-cfg-group', b.dataset.g); }catch(e){}
      });
    });
  }

  const form = $('cfgForm');
  if(!form) return;

  const fill = cfg => {
    if(!cfg) return;
    const v = (k, d='') => cfg[k] !== undefined && cfg[k] !== null ? String(cfg[k]) : d;
    CFG_FIELDS.forEach(k=>{ const el = $('cfg_'+k); if(el) el.value = v(k); });
    const sg = cfg.muvcharMinuyMecholel || {};
    const setv = (id, val) => { const el = $(id); if(el) el.value = val; };
    const setchk = (id, val) => { const el = $(id); if(el) el.checked = !!val; };
    setv('cfg_SUBNAME', sg.SUBNAME || '');
    setv('cfg_SUBUpdateTime', sg.SUBUpdateTime !== undefined ? String(sg.SUBUpdateTime) : '');
    setchk('cfg_local', sg.local !== false);
    const pool = sg.sifriyatIPmekomit || {};
    setchk('cfg_ipAckrai', !!pool.ipAckrai);
    setv('cfg_kamutAckrait', pool.kamutAckrait !== undefined ? String(pool.kamutAckrait) : '');
    setv('cfg_portMeyuchad', pool.portMeyuchad !== undefined ? String(pool.portMeyuchad) : '');
    setchk('cfg_dalegImutTeuda', !!cfg.dalegImutTeuda);
    setchk('cfg_pilugTLS', !!cfg.pilugTLS);
  };
  /* ---------- منبع Clean IPs / Domains ---------- */
  const CIP_TYPE = { ip:'page.configs.cleanip.type.ip', domain:'page.configs.cleanip.type.domain' };
  const cipBody = $('cipBody'), cipInput = $('cipInput'), cipAdd = $('cipAdd'), cipCount = $('cipCount');
  const renderCip = items => {
    if(!cipBody) return;
    if(!items.length){ cipBody.innerHTML = `<tr><td colspan="4" class="empty">${tr('page.configs.cleanip.empty')}</td></tr>`; return; }
    cipBody.innerHTML = items.map(it=>`<tr>
      <td class="mono-cell" dir="ltr">${escapeHtml(it.value)}</td>
      <td><span class="st ${it.type==='ip'?'active':'trial'}">${tr(CIP_TYPE[it.type]||CIP_TYPE.domain)}</span></td>
      <td class="mono-cell">${fmtDate(it.addedAt)}</td>
      <td><button class="act danger" data-del="${escapeHtml(it.value)}" title="${tr('page.configs.cleanip.delete')}"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button></td>
    </tr>`).join('');
  };
  const loadCip = async ()=>{
    const d = await api('/api/clean-ips', { method:'GET' });
    renderCip(d.items || []);
    if(cipCount) cipCount.textContent = (d.items || []).length;
  };
  /* اگر سرور در دسترس نباشد، پیام راهنما در جدول نشان داده می‌شود */
  const cipOffline = ()=>{
    if(cipBody) cipBody.innerHTML = `<tr><td colspan="4" class="empty">${tr('page.configs.cleanip.offline')}</td></tr>`;
  };
  if(cipAdd && cipInput){
    cipAdd.addEventListener('click', async ()=>{
      const v = (cipInput.value || '').trim();
      if(!v){ toast(tr('page.configs.cleanip.req'), '#ffb454'); return; }
      cipAdd.disabled = true;
      try{
        const d = await api('/api/clean-ips', { method:'POST', body:{ value:v } });
        cipInput.value = '';
        renderCip(d.items || []);
        if(cipCount) cipCount.textContent = d.total;
        toast(tr('page.configs.cleanip.added'), '#3ddc97');
      }catch(e){ if(e.message !== 'UNAUTHORIZED') toast(tr('users.operr') + ' — ' + errMsg(e), '#ff6b7a'); }
      finally{ cipAdd.disabled = false; }
    });
    cipInput.addEventListener('keydown', e=>{ if(e.key === 'Enter') cipAdd.click(); });
  }
  if(cipBody){
    cipBody.addEventListener('click', async e=>{
      const b = e.target.closest('button[data-del]');
      if(!b) return;
      const v = b.dataset.del;
      if(!confirm(tr('page.configs.cleanip.delconf'))) return;
      try{
        const d = await api('/api/clean-ips?value=' + encodeURIComponent(v), { method:'DELETE' });
        renderCip(d.items || []);
        if(cipCount) cipCount.textContent = d.total;
        toast(tr('page.configs.cleanip.removed'), '#ff6b7a');
      }catch(e){ if(e.message !== 'UNAUTHORIZED') toast(tr('users.operr') + ' — ' + errMsg(e), '#ff6b7a'); }
    });
  }

  /* ---------- منبع Proxy IP ---------- */
  const pxBody = $('pxBody'), pxInput = $('pxInput'), pxAdd = $('pxAdd'),
        pxSave = $('pxSave'), pxState = $('pxState'),
        pxEnable = $('pxEnable'), pxType = $('pxType'), pxAccount = $('pxAccount'), pxGlobal = $('pxGlobal');
  let pxPool = [];
  const renderPx = items => {
    if(!pxBody) return;
    if(!items.length){ pxBody.innerHTML = `<tr><td colspan="3" class="empty">${tr('page.configs.proxyip.empty')}</td></tr>`; return; }
    pxBody.innerHTML = items.map(it=>{
      const parts = String(it.value).split('#');
      const loc = parts.length > 1 ? parts.pop() : '';
      const host = parts.join('#');
      return `<tr>
      <td class="mono-cell" dir="ltr">${escapeHtml(host)}${loc ? ` <span class="st active">${escapeHtml(loc)}</span>` : ''}</td>
      <td class="mono-cell">${fmtDate(it.addedAt)}</td>
      <td><button class="act danger" data-pxdel="${escapeHtml(it.value)}" title="${tr('page.configs.cleanip.delete')}"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button></td>
    </tr>`;
    }).join('');
  };
  const fillPx = cfg => {
    const mv = (cfg && cfg.metavech) || {};
    if(pxEnable) pxEnable.checked = !!mv.enabled;
    if(pxType) pxType.value = mv.type || 'auto';
    if(pxAccount) pxAccount.value = mv.account || '';
    if(pxGlobal) pxGlobal.checked = !!mv.global;
  };
  const loadPx = async ()=>{
    const d = await api('/api/proxy-ips', { method:'GET' });
    pxPool = d.items || [];
    renderPx(pxPool);
  };
  if(pxAdd && pxInput){
    pxAdd.addEventListener('click', async ()=>{
      const v = (pxInput.value || '').trim();
      if(!v){ toast(tr('page.configs.proxyip.req'), '#ffb454'); return; }
      pxAdd.disabled = true;
      try{
        const d = await api('/api/proxy-ips', { method:'POST', body:{ value:v } });
        pxInput.value = ''; pxPool = d.items || []; renderPx(pxPool);
        toast(tr('page.configs.cleanip.added'), '#3ddc97');
      }catch(e){ if(e.message !== 'UNAUTHORIZED') toast(tr('users.operr') + ' — ' + errMsg(e), '#ff6b7a'); }
      finally{ pxAdd.disabled = false; }
    });
    pxInput.addEventListener('keydown', e=>{ if(e.key === 'Enter') pxAdd.click(); });
  }
  if(pxBody){
    pxBody.addEventListener('click', async e=>{
      const b = e.target.closest('button[data-pxdel]');
      if(!b) return;
      if(!confirm(tr('page.configs.cleanip.delconf'))) return;
      try{
        const d = await api('/api/proxy-ips?value=' + encodeURIComponent(b.dataset.pxdel), { method:'DELETE' });
        pxPool = d.items || []; renderPx(pxPool);
        toast(tr('page.configs.cleanip.removed'), '#ff6b7a');
      }catch(e){ if(e.message !== 'UNAUTHORIZED') toast(tr('users.operr') + ' — ' + errMsg(e), '#ff6b7a'); }
    });
  }
  if(pxSave){
    pxSave.addEventListener('click', async ()=>{
      pxSave.disabled = true;
      try{
        const cfg = await (await api('/api/config', { method:'GET' })).config || {};
        cfg.metavech = {
          enabled: !!(pxEnable && pxEnable.checked),
          type: (pxType && pxType.value) || 'auto',
          account: (pxAccount && pxAccount.value.trim()) || '',
          global: !!(pxGlobal && pxGlobal.checked),
        };
        await api('/api/config', { method:'PUT', body: cfg });
        if(pxState){ pxState.textContent = tr('configs.saved'); pxState.classList.add('show'); setTimeout(()=>pxState.classList.remove('show'), 2400); }
        toast(tr('configs.saved'), '#3ddc97');
      }catch(e){ if(e.message !== 'UNAUTHORIZED') toast(tr('users.operr') + ' — ' + errMsg(e), '#ff6b7a'); }
      finally{ pxSave.disabled = false; }
    });
  }

  /* ---------- Tunnel / Relay ---------- */
  const tunStatus = $('tunStatus'), tunUrl = $('tunUrl'), tunKey = $('tunKey'),
        tunGas = $('tunGas'), tunReveal = $('tunReveal'), tunGen = $('tunGen'),
        tunSave = $('tunSave'), tunVerify = $('tunVerify'), tunOff = $('tunOff'),
        tunState = $('tunState'), tunInfo = $('tunInfo');
  const loadTun = async ()=>{
    const d = await api('/api/tunnel', { method:'GET' });
    const t = d.tunnel || {};
    if(tunUrl) tunUrl.value = t.workerUrl || '';
    if(tunKey) tunKey.value = t.authKey || '';
    if(tunGas) tunGas.value = t.gasUrl || '';
    if(tunStatus){
      tunStatus.textContent = t.enabled ? tr('page.configs.tunnel.on') : tr('page.configs.tunnel.off');
      tunStatus.className = 'st ' + (t.enabled ? 'active' : 'suspended');
    }
    if(tunInfo) tunInfo.textContent = t.enabled
      ? (t.verified ? tr('page.configs.tunnel.verified') : tr('page.configs.tunnel.notverified'))
      : tr('page.configs.tunnel.hint');
  };
  if(tunSave){
    tunReveal.addEventListener('click', ()=>{ tunKey.type = tunKey.type === 'password' ? 'text' : 'password'; tunReveal.textContent = tunKey.type === 'password' ? tr('page.configs.tunnel.reveal') : tr('page.configs.tunnel.hide'); });
    tunGen.addEventListener('click', async ()=>{
      try{ const d = await api('/api/tunnel', { method:'POST', body:{ action:'generate_key' } }); tunKey.value = (d.tunnel && d.tunnel.authKey) || ''; toast(tr('page.configs.tunnel.generated'), '#3ddc97'); }
      catch(e){ if(e.message !== 'UNAUTHORIZED') toast(tr('users.operr') + ' — ' + errMsg(e), '#ff6b7a'); }
    });
    tunSave.addEventListener('click', async ()=>{
      tunSave.disabled = true;
      try{
        await api('/api/tunnel', { method:'POST', body:{ action:'save', authKey: tunKey.value, gasUrl: tunGas.value } });
        if(tunState){ tunState.textContent = tr('configs.saved'); tunState.classList.add('show'); setTimeout(()=>tunState.classList.remove('show'), 2400); }
        await loadTun();
        toast(tr('configs.saved'), '#3ddc97');
      }catch(e){ if(e.message !== 'UNAUTHORIZED') toast(tr('users.operr') + ' — ' + errMsg(e), '#ff6b7a'); }
      finally{ tunSave.disabled = false; }
    });
    tunVerify.addEventListener('click', async ()=>{
      tunVerify.disabled = true;
      if(tunInfo) tunInfo.textContent = tr('page.configs.tunnel.verifying');
      try{
        const d = await api('/api/tunnel', { method:'POST', body:{ action:'verify', authKey: tunKey.value, gasUrl: tunGas.value } });
        if(tunInfo) tunInfo.textContent = d.verified ? tr('page.configs.tunnel.verified') : (tr('page.configs.tunnel.verifyfail') + ' ' + (d.error || ''));
        if(tunStatus){ tunStatus.textContent = tr('page.configs.tunnel.on'); tunStatus.className = 'st active'; }
      }catch(e){ if(tunInfo && e.message !== 'UNAUTHORIZED') tunInfo.textContent = tr('page.configs.tunnel.verifyfail') + ' ' + errMsg(e); }
      finally{ tunVerify.disabled = false; }
    });
    tunOff.addEventListener('click', async ()=>{
      if(!confirm(tr('page.configs.tunnel.offconf'))) return;
      try{ await api('/api/tunnel', { method:'POST', body:{ action:'disable' } }); await loadTun(); toast(tr('page.configs.tunnel.offdone'), '#ff6b7a'); }
      catch(e){ if(e.message !== 'UNAUTHORIZED') toast(tr('users.operr') + ' — ' + errMsg(e), '#ff6b7a'); }
    });
  }

  /* ---------- گروه WARP ---------- */
  const warpEnable = $('warpEnable'), warpMode = $('warpMode'),
        warpEndpoint = $('warpEndpoint'), warpClean = $('warpClean'),
        warpSave = $('warpSave'), warpState = $('warpState'), warpStatus = $('warpStatus');
  const fillWarp = cfg => {
    const w = (cfg && cfg.warp) || {};
    if(warpEnable) warpEnable.checked = !!w.enabled;
    if(warpMode) warpMode.value = (w.mode === 'chain') ? 'chain' : 'wow';
    if(warpEndpoint) warpEndpoint.value = w.endpoint || '';
    if(warpClean) warpClean.checked = !!w.cleanIp;
    if(warpStatus){
      warpStatus.textContent = w.enabled ? tr('page.configs.warp.on') : tr('page.configs.warp.off');
      warpStatus.className = 'st ' + (w.enabled ? 'active' : 'suspended');
    }
  };
  if(warpSave){
    warpSave.addEventListener('click', async ()=>{
      warpSave.disabled = true;
      try{
        const cfg = (await api('/api/config', { method:'GET' })).config || {};
        cfg.warp = {
          enabled: !!(warpEnable && warpEnable.checked),
          mode: (warpMode && warpMode.value) || 'wow',
          endpoint: (warpEndpoint && warpEndpoint.value.trim()) || '',
          cleanIp: !!(warpClean && warpClean.checked),
        };
        await api('/api/config', { method:'PUT', body: cfg });
        fillWarp(cfg);
        if(warpState){ warpState.textContent = tr('configs.saved'); warpState.classList.add('show'); setTimeout(()=>warpState.classList.remove('show'), 2400); }
        toast(tr('configs.saved'), '#3ddc97');
      }catch(e){ if(e.message !== 'UNAUTHORIZED') toast(tr('users.operr') + ' — ' + errMsg(e), '#ff6b7a'); }
      finally{ warpSave.disabled = false; }
    });
  }

  /* اگر HOST خالی باشد، خودکار از آدرس فعلی پنل پر می‌شود (فقط پیشنهاد — قابل ویرایش) */
  function autoFillHost(){
    const h = $('cfg_HOST');
    if(h && !h.value.trim()){
      try{
        const hn = location.hostname || '';
        if(hn && hn !== 'localhost' && hn !== '127.0.0.1') h.value = hn;
      }catch(e){}
    }
  }

  /* بارگذاری از سرور — با retry بعد از ورود */
  const loadCfg = async ()=>{
    const d = await api('/api/config', { method:'GET' });
    fill(d.config);
    autoFillHost();
    fillPx(d.config);
    fillWarp(d.config);
    refreshCustomSelects();
    const st = $('cfgState');
    if(st){ st.textContent = tr('configs.loaded'); st.classList.add('show'); setTimeout(()=>st.classList.remove('show'),2200); }
  };
  (async function loadAll(attempt){
    try{
      await Promise.all([loadCfg(), loadCip(), loadPx(), loadTun()]);
    }catch(e){
      if(e && e.message === 'UNAUTHORIZED' && attempt < 3){
        await new Promise(r=>setTimeout(r,150));
        await loadAll(attempt + 1);
      }else if(e && e.message !== 'UNAUTHORIZED'){
        const st = $('cfgState');
        if(st){ st.textContent = tr('configs.empty'); st.style.color = 'var(--amber)'; }
        if(e && (e.message === 'NETWORK' || e.message === 'NOT_API')) cipOffline();
      }
    }
  })(0);

  /* ذخیره */
  const saveBtn = $('cfgSave');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    const val = k => { const el = $( 'cfg_'+k ); return el ? el.value.trim() : ''; };
    const num = k => { const x = Number(val(k)); return isNaN(x) ? 0 : x; };
    const bool = k => { const el = $( 'cfg_'+k ); return !!(el && el.checked); };
    const cfg = {
      HOST: val('HOST'), UUID: val('UUID'), PATH: val('PATH') || '/',
      sugProtokol: val('sugProtokol') || 'vless',
      protokolHaavara: val('protokolHaavara') || 'ws',
      gRPCmode: val('gRPCmode'),
      dalegImutTeuda: bool('dalegImutTeuda'),
      pilugTLS: bool('pilugTLS') ? true : null,
      Fingerprint: val('Fingerprint') || 'chrome',
      muvcharMinuyMecholel: {
        local: $('cfg_local') ? $('cfg_local').checked : true,
        sifriyatIPmekomit: {
          ipAckrai: $('cfg_ipAckrai') ? $('cfg_ipAckrai').checked : true,
          kamutAckrait: num('kamutAckrait') || 16,
          portMeyuchad: $('cfg_portMeyuchad') ? num('portMeyuchad') : -1,
        },
        SUBNAME: val('SUBNAME') || 'RAHIN',
        SUBUpdateTime: num('SUBUpdateTime') || 3,
      },
    };
    if(!cfg.HOST || !cfg.UUID){ toast(tr('configs.needhost'),'#ffb454'); return; }
    saveBtn.disabled = true;
    try{
      await api('/api/config', { method:'PUT', body: cfg });
      const st = $('cfgState');
      if(st){ st.textContent = tr('configs.saved'); st.style.color='var(--green)'; st.classList.add('show'); setTimeout(()=>st.classList.remove('show'),2400); }
      toast(tr('configs.saved'),'#3ddc97');
    }catch(e){ toast(tr('configs.saveerr')+(e.message!=='UNAUTHORIZED'?' '+e.message:''),'#ff6b7a'); }
    finally{ saveBtn.disabled = false; }
  });
}

/* ============ PAGE INIT: Users ============ */
const USER_STATUS_KEYS = { active:'page.users.st.active', disabled:'page.users.st.disabled', expired:'page.users.st.expired', 'quota-exceeded':'page.users.st.quota', 'daily-quota-exceeded':'page.users.st.dq' };
function fmtBytes(b){
  if(!b) return '0 B';
  const u=['B','KB','MB','GB','TB']; let i=0, v=b;
  while(v>=1024 && i<u.length-1){ v/=1024; i++; }
  return v.toFixed(i>=3?1:0)+' '+u[i];
}
function fmtDate(iso){ if(!iso) return '—'; try{ return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return iso; } }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function usersInit(){
  setupReveal();
  const body = $('usersBody');
  if(!body) return;

  const tbody = $('usersBody');
  const load = async ()=>{
    tbody.innerHTML = `<tr><td colspan="8" class="loading-row">${tr('users.loading')}</td></tr>`;
    try{
      const d = await api('/api/users', { method:'GET' });
      renderUsers(d.users || []);
      const cnt = $('usersCount'); if(cnt) cnt.textContent = (d.users||[]).length;
    }catch(e){
      tbody.innerHTML = `<tr><td colspan="8" class="empty">${e.message==='UNAUTHORIZED'?'':tr('users.err')}</td></tr>`;
    }
  };

  const renderUsers = users => {
    if(!users.length){ tbody.innerHTML = `<tr><td colspan="8" class="empty">${tr('users.empty')}</td></tr>`; return; }
    tbody.innerHTML = users.map(u => {
      const st = u.status || 'active';
      const stKey = USER_STATUS_KEYS[st] || USER_STATUS_KEYS.active;
      const initials = (u.name||'?').split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase();
      const hue = (parseInt(u.id,36) % 360) || 165;
      const totalGB = u.quotaBytes ? ((u.usage.totalBytes||0)/1073741824).toFixed(1)+' / '+(u.quotaBytes/1073741824).toFixed(0)+' GB' : fmtBytes(u.usage.totalBytes||0);
      const pct = u.quotaBytes ? Math.min(100, Math.round(((u.usage.totalBytes||0)/u.quotaBytes)*100)) : 0;
      return `<tr data-id="${escapeHtml(u.id)}">
        <td><span class="u"><i class="av" style="--h:${hue}">${escapeHtml(initials)}</i><span class="u-t"><b>${escapeHtml(u.name||'')}</b><small>${escapeHtml(u.username||'')}${u.userIps&&u.userIps.length?' · '+u.userIps.length+' IP':''}${u.userProxyIps&&u.userProxyIps.length?' · '+u.userProxyIps.length+' PX':''}</small></span></span></td>
        <td class="mono-cell">${escapeHtml(u.tag||'—')}</td>
        <td>${u.quotaBytes?`<span class="usage"><i style="--w:${pct}%"></i></span><small class="mono">${totalGB}</small>`:fmtBytes(u.usage.totalBytes||0)}</td>
        <td class="mono-cell">${fmtDate(u.expiry)}</td>
        <td><span class="st ${st}">${tr(stKey)}</span></td>
        <td>
          <div class="acts">
            <button class="act" data-act="copy" data-sub="${escapeHtml(u.subscriptionUrl||'')}" title="Copy sub link"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
            <button class="act ${u.enabled===false?'':'on'}" data-act="toggle" title="Enable/disable"><svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg></button>
            <button class="act" data-act="reset" title="Reset usage"><svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
            <button class="act" data-act="edit" title="Edit"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
            <button class="act danger" data-act="del" title="Delete"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
          </div>
        </td>
      </tr>`;
    }).join('');
  };

  /* اکشنها با event delegation */
  tbody.addEventListener('click', async e=>{
    const btn = e.target.closest('.act');
    if(!btn) return;
    const tr = btn.closest('tr');
    const id = tr && tr.dataset.id;
    const act = btn.dataset.act;
    if(!id) return;
    const found = (await api('/api/users?id='+id,{method:'GET'})).user;
    if(act === 'copy'){
      const sub = btn.dataset.sub;
      try{
        const full = location.origin + sub;
        if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(full); }
        else { const ta=document.createElement('textarea'); ta.value=full; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
        toast(tr('users.copied')+' '+escapeHtml(found.name||''),'#3ddc97');
      }catch(e){ toast(tr('users.copyerr'),'#ff6b7a'); }
      return;
    }
    if(act === 'toggle'){
      try{ await api('/api/users?id='+id+'&action=toggle',{method:'POST',body:{}}); load(); }catch(e){ toast(tr('users.operr'),'#ff6b7a'); }
      return;
    }
    if(act === 'reset'){
      try{ await api('/api/users?id='+id+'&action=reset',{method:'POST',body:{}}); toast(tr('users.reseted'),'#3ddc97'); load(); }catch(e){ toast(tr('users.operr'),'#ff6b7a'); }
      return;
    }
    if(act === 'edit'){ openUserModal(found); return; }
    if(act === 'del'){
      const ok = await customConfirm(tr('users.delconf'));
      if(!ok) return;
      try{ await api('/api/users?id='+id,{method:'DELETE'}); toast(tr('users.del'),'#ff6b7a'); load(); }catch(e){ toast(tr('users.operr'),'#ff6b7a'); }
      return;
    }
  });

  const addBtn = $('usersAdd');
  if(addBtn) addBtn.addEventListener('click', ()=>openUserModal(null));

  /* فرم کاربر */
  function userFormHtml(u){
    const v = (k,d='') => u ? (u[k] !== undefined && u[k] !== null ? String(u[k]) : d) : d;
    const quotaGB = u && u.quotaBytes ? (u.quotaBytes/1073741824) : '';
