/* ============ PAGE INIT: Scanner ============ */
/* Behaviour is a faithful port of the standalone scanner file.
   Only the presentation layer (panel classes / i18n / teardown) differs. */
const scannerState = {
  scanning:false, abort:null, results:[], scanned:0, total:0,
  seq:0, statusKey:'page.scanner.status.ready', statusArg:'', statusSuffix:'', statusNum:'', statusTone:''
};

function scannerInit(){
  const el = {
    ips:$('scIps'), ports:$('scPorts'), conc:$('scConc'),
    start:$('scStart'), stop:$('scStop'), clear:$('scClear'), copy:$('scCopy'),
    clearMobile:$('scClearMobile'), copyMobile:$('scCopyMobile'),
    send:$('scSendAlive'), sendMobile:$('scSendAliveMobile'),
    body:$('scBody'), status:$('scStatus'), fill:$('scFill'),
    kTotal:$('scTotal'), kUp:$('scUp'), kTime:$('scTimeout')
  };
  if(!el.ips || !el.start){ setupReveal(); return; }

  /* Preview layer keeps port commas neon while the real input remains fully editable. */
  const portsPreview = $('scPortsPreview');
  const escapePreview = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const paintPortsPreview = () => {
    if(portsPreview) portsPreview.innerHTML = escapePreview(el.ports.value).replace(/,/g, '<span class="port-comma">,</span>');
  };
  paintPortsPreview();

  const S = scannerState;
  S.scanning=false; S.abort=null; S.results=[]; S.scanned=0; S.total=0;
  S.seq++; S.statusKey='page.scanner.status.ready'; S.statusArg=''; S.statusSuffix=''; S.statusNum=''; S.statusTone='';

  const TIMEOUT_MS = 5000;
  const MAX_HOSTS  = 256;
  const STATUS_KEY = { up:'page.scanner.res.active', down:'page.scanner.res.down', timeout:'page.scanner.res.timeout' };
  const STATUS_CLS = { up:'active', down:'suspended', timeout:'suspended' };

  /* ---- keep placeholders / dynamic strings in sync with the panel language ---- */
  function paintDynamic(){
    el.ips.placeholder   = tr('page.scanner.targets.hint');
    el.ports.placeholder = tr('page.scanner.ports.hint');
    el.conc.placeholder  = tr('page.scanner.conc.hint');
    renderStatus();
    el.body.querySelectorAll('td[data-st]').forEach(td=>{
      const st = td.getAttribute('data-st');
      const b = td.querySelector('.st');
      if(b) b.textContent = tr(STATUS_KEY[st] || STATUS_KEY.down);
    });
    const empty = el.body.querySelector('[data-sc-empty]');
    if(empty) empty.textContent = tr('page.scanner.empty');
    paintCounters();
  }
  const langObs = new MutationObserver(paintDynamic);
  langObs.observe(document.documentElement, { attributes:true, attributeFilter:['lang'] });
  addTeardown(()=>langObs.disconnect());

  function renderStatus(){
    el.status.textContent =
      (S.statusNum !== '' ? S.statusNum : '') +
      tr(S.statusKey) +
      (S.statusArg || '') +
      (S.statusSuffix ? tr(S.statusSuffix) : '');
    el.status.className = 'sc-status' + (S.statusTone ? ' ' + S.statusTone : '');
  }
  function setStatus(key, arg, tone, suffixKey, num){
    S.statusKey = key;
    S.statusArg = arg || '';
    S.statusTone = tone || '';
    S.statusSuffix = suffixKey || '';
    S.statusNum = (num === undefined || num === null) ? '' : num;
    renderStatus();
  }

  /* ---- Validation (original) ---- */
  function isValidIP(ip){
    if(!ip || typeof ip !== 'string') return false;
    const parts = ip.split('.');
    if(parts.length !== 4) return false;
    return parts.every(p=>{
      const n = parseInt(p,10);
      return !isNaN(n) && n>=0 && n<=255 && String(n)===p;
    });
  }
  function isValidCIDR(cidr){
    const parts = cidr.split('/');
    if(parts.length !== 2) return false;
    const mask = parseInt(parts[1],10);
    return isValidIP(parts[0]) && !isNaN(mask) && mask>=0 && mask<=32;
  }

  /* ---- Subnet & IP math (original) ---- */
  function ipToLong(ip){
    return ip.split('.').reduce((acc,octet)=>(acc<<8)+parseInt(octet,10),0)>>>0;
  }
  function longToIp(long){
    return [(long>>>24),(long>>16&255),(long>>8&255),(long&255)].join('.');
  }
  function parseCIDR(cidr){
    if(!isValidCIDR(cidr)) return [];
    const [ip,maskStr] = cidr.split('/');
    const mask = parseInt(maskStr,10);
    const ipLong = ipToLong(ip);
    const maskLong = ~((1 << (32 - mask)) - 1) >>> 0;
    const networkLong = ipLong & maskLong;
    const broadcastLong = networkLong | (~maskLong >>> 0);

    if(mask === 32) return [ip];
    if(mask === 31) return [longToIp(networkLong), longToIp(broadcastLong)];

    const hostCount = broadcastLong - networkLong - 1;
    if(hostCount > MAX_HOSTS){
      console.warn(`CIDR ${cidr} has ${hostCount} hosts; limiting to ${MAX_HOSTS}`);
    }

    const ips = [];
    const start = networkLong + 1;
    const end = Math.min(broadcastLong, start + MAX_HOSTS);
    for(let i=start;i<end;i++) ips.push(longToIp(i));
    return ips;
  }

  function getTargetIPs(inputString){
    const lines = inputString.split(/[\n, ]+/).map(l=>l.trim()).filter(Boolean);
    const ips = new Set();
    const invalid = [];
    for(const line of lines){
      if(line.includes('/')){
        if(isValidCIDR(line)) parseCIDR(line).forEach(ip=>ips.add(ip));
        else invalid.push(line);
      } else {
        if(isValidIP(line)) ips.add(line);
        else invalid.push(line);
      }
    }
    return { ips:Array.from(ips), invalid };
  }

  function getTargetPorts(inputString){
    const ports = inputString.split(',')
      .map(p=>parseInt(p.trim(),10))
      .filter(p=>!isNaN(p) && p>=1 && p<=65535);
    return [...new Set(ports)];
  }

  /* ---- Network scanner core (original) ---- */
  async function pingTarget(ip, port, globalSignal){
    const start = performance.now();
    const protocol = (port === 443 || port === 8443) ? 'https' : 'http';
    const url = `${protocol}://${ip}:${port}`;

    const localController = new AbortController();
    const timeoutId = setTimeout(()=>localController.abort(), TIMEOUT_MS);

    let signal, onAbort = null;
    if(globalSignal && typeof AbortSignal !== 'undefined' && AbortSignal.any){
      signal = AbortSignal.any([globalSignal, localController.signal]);
    } else {
      signal = localController.signal;
      if(globalSignal){
        onAbort = ()=>localController.abort();
        globalSignal.addEventListener('abort', onAbort);
      }
    }

    try{
      await fetch(url, { mode:'no-cors', cache:'no-store', signal });
      clearTimeout(timeoutId);
      const latency = Math.round(performance.now() - start);
      return { status:'up', latency };
    }catch(err){
      clearTimeout(timeoutId);
      if(err.name === 'AbortError'){
        if(globalSignal && globalSignal.aborted) throw err;
        return { status:'timeout', latency:'-' };
      }
      const elapsed = performance.now() - start;
      if(elapsed >= TIMEOUT_MS) return { status:'timeout', latency:'-' };
      return { status:'down', latency:'-' };
    }finally{
      if(onAbort && globalSignal) globalSignal.removeEventListener('abort', onAbort);
    }
  }

  /* ---- Build a single row (panel markup) ---- */
  function latClass(v){
    if(v === '-') return '';
    if(v < 300) return 'fast';
    if(v < 1200) return 'mid';
    return 'slow';
  }
  function buildRow(item){
    const tr_ = document.createElement('tr');
    tr_.dataset.lat = item.latency === '-' ? '999999' : item.latency;

    const tdIp = document.createElement('td');
    const chip = document.createElement('span');
    chip.className = 'copy-ip'; chip.dataset.ip = item.ip; chip.textContent = item.ip;
    tdIp.appendChild(chip);

    const tdPort = document.createElement('td');
    tdPort.className = 'mono-cell'; tdPort.textContent = item.port;

    const tdSt = document.createElement('td');
    tdSt.setAttribute('data-st', item.status);
    const badge = document.createElement('span');
    badge.className = 'st ' + (STATUS_CLS[item.status] || 'suspended');
    badge.textContent = tr(STATUS_KEY[item.status] || STATUS_KEY.down);
    tdSt.appendChild(badge);

    const tdLat = document.createElement('td');
    const lat = document.createElement('span');
    lat.className = 'sc-lat ' + latClass(item.latency);
    lat.textContent = item.latency === '-' ? '—' : item.latency + ' ms';
    tdLat.appendChild(lat);

    /* دکمه + — افزودن این آیپی به منبع Clean IPs (فقط برای در دسترس‌ها) */
    const tdAct = document.createElement('td');
    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'act' + (item.status === 'up' ? '' : ' muted');
    addBtn.title = tr('page.scanner.sendone');
    addBtn.dataset.addIp = item.ip;
    addBtn.disabled = item.status !== 'up';
    addBtn.innerHTML = '<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
    tdAct.appendChild(addBtn);

    tr_.append(tdIp, tdPort, tdSt, tdLat, tdAct);
    return tr_;
  }

  /* ---- Insert row in sorted position, by latency ascending (original) ---- */
  function insertSortedRow(item){
    const tbody = el.body;
    const tr_ = buildRow(item);

    if(tbody.children.length === 0 || tbody.querySelector('[data-sc-empty]')){
      tbody.innerHTML = '';
      tbody.appendChild(tr_);
      return;
    }

    const itemLatency = item.latency === '-' ? 999999 : parseInt(item.latency, 10);
    const rows = Array.from(tbody.children);
    for(let i=0;i<rows.length;i++){
      const rowLatency = parseInt(rows[i].dataset.lat, 10) || 999999;
      if(itemLatency < rowLatency){
        tbody.insertBefore(tr_, rows[i]);
        return;
      }
    }
    tbody.appendChild(tr_);
  }

  function clearResults(){
    S.results = []; S.scanned = 0; S.total = 0;
    const tr_ = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 5; td.className = 'empty'; td.setAttribute('data-sc-empty','');
    td.textContent = tr('page.scanner.empty');
    tr_.appendChild(td); tr_.style.cursor = 'default';
    el.body.replaceChildren(tr_);
    el.fill.style.width = '0%';
    paintCounters();
  }

  function paintCounters(){
    const up = S.results.filter(r=>r.status === 'up').length;
    const timeout = S.results.filter(r=>r.status === 'timeout').length;
    el.kUp.textContent = up; el.kTime.textContent = timeout;
    el.kTotal.textContent = S.results.length + (S.total ? ' / ' + S.total : '');
    if(S.total > 0) el.fill.style.width = Math.round((S.scanned / S.total) * 100) + '%';
  }

  /* ---- Concurrency pool (original) ---- */
  function runPool(tasks, concurrency, globalSignal, onEach){
    const queue = tasks.map((task,i)=>({ task, i }));
    const results = new Array(tasks.length);
    let active = 0, index = 0;

    return new Promise(resolve=>{
      function next(){
        if(globalSignal && globalSignal.aborted){ resolve(results); return; }
        if(index >= queue.length && active === 0){ resolve(results); return; }
        while(active < concurrency && index < queue.length){
          if(globalSignal && globalSignal.aborted) break;
          const currentIndex = index++;
          active++;
          queue[currentIndex].task().then(result=>{
            results[currentIndex] = result;
            active--; onEach(result); next();
          }).catch(err=>{
            active--; onEach({ error:err }); next();
          });
        }
      }
      next();
    });
  }

  /* ---- Main control flow (original) ---- */
  async function startScan(){
    if(S.scanning) return;

    const { ips, invalid } = getTargetIPs(el.ips.value);
    const ports = getTargetPorts(el.ports.value);
    const concurrency = parseInt(el.conc.value, 10) || 1;

    if(ips.length === 0 || ports.length === 0){
      if(invalid.length > 0)
        setStatus('page.scanner.status.invalid', invalid.slice(0,5).join(', ') + (invalid.length>5?'...':''), 'err');
      else
        setStatus('page.scanner.status.needinput','','err');
      return;
    }

    if(invalid.length > 0){
      setStatus('page.scanner.status.skipped', invalid.slice(0,5).join(', ') + (invalid.length>5?'...':''), 'err');
    }

    S.scanning = true;
    el.start.disabled = true;
    el.stop.disabled = false;
    S.results = []; S.scanned = 0;
    clearResults();
    el.fill.style.width = '0%';

    S.abort = new AbortController();
    const signal = S.abort.signal;
    const mySeq = S.seq;

    S.total = ips.length * ports.length;
    paintCounters();

    const tasks = [];
    for(const ip of ips){
      for(const port of ports){
        tasks.push(async ()=>{
          if(invalid.length === 0)
            setStatus('page.scanner.status.scanning', ` ${ip}:${port} · ${S.scanned}/${S.total}`, 'run');
          try{
            const result = await pingTarget(ip, port, signal);
            S.scanned++;
            const item = { ip, port, status:result.status, latency:result.latency };
            if(mySeq !== S.seq) return item;
            S.results.push(item); insertSortedRow(item); paintCounters();
            return item;
          }catch(err){
            S.scanned++;
            if(mySeq !== S.seq) return null;
            if(err && err.name === 'AbortError'){
              const item = { ip, port, status:'timeout', latency:'-' };
              S.results.push(item); insertSortedRow(item); paintCounters();
              return item;
            }
            const item = { ip, port, status:'down', latency:'-' };
            S.results.push(item); insertSortedRow(item); paintCounters();
            return item;
          }
        });
      }
    }

    try{
      await runPool(tasks, Math.min(Math.max(concurrency,1),50), signal, ()=>{});
      if(!signal.aborted && mySeq === S.seq){
        setStatus('page.scanner.status.done', S.total, 'ok', 'page.scanner.status.probes');

      }
    }catch(err){
      if(mySeq === S.seq) setStatus('page.scanner.status.error','','err');
    }finally{
      if(mySeq === S.seq){
        S.scanning = false;
        el.start.disabled = false;
        el.stop.disabled = true;
        S.abort = null;
        paintCounters();
      }
    }
  }

  function stopScan(){
    if(S.abort) S.abort.abort();
    S.scanning = false;
    setStatus('page.scanner.status.aborted','','err');
    el.start.disabled = false;
    el.stop.disabled = true;
  }

  /* ---- Copy handlers (original) ---- */
  function fallbackCopy(text){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '-9999px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    try{
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      const ok = document.execCommand('copy');
      return ok ? Promise.resolve() : Promise.reject(new Error('Clipboard copy failed'));
    }catch(e){
      return Promise.reject(e);
    }finally{
      ta.remove();
    }
  }

  function copyText(text){
    /* Prefer the modern API; a textarea fallback also supports non-secure Worker previews. */
    if(navigator.clipboard && typeof navigator.clipboard.writeText === 'function'){
      try{ return Promise.resolve(navigator.clipboard.writeText(text)).catch(()=>fallbackCopy(text)); }
      catch(e){ return fallbackCopy(text); }
    }
    return fallbackCopy(text);
  }

  /* ---- wiring (routed through the panel teardown registry) ---- */
  const on = (node, ev, fn) => {
    if(!node) return;
    node.addEventListener(ev, fn);
    addTeardown(()=>node.removeEventListener(ev, fn));
  };

  /* Click on IP in table (event delegation) */
  on(el.body,'click', e=>{
    /* دکمه + کنار ردیف → ارسال همان آیپی به منبع Clean IPs */
    const addBtn = e.target.closest('button[data-add-ip]');
    if(addBtn){
      const ip = addBtn.dataset.addIp;
      if(ip) sendToSource([ip]);
      return;
    }
    const chip = e.target.closest('.copy-ip');
    if(!chip) return;
    const ip = chip.dataset.ip;
    if(!ip) return;
    copyText(ip)
      .then(()=>setStatus('page.scanner.status.copied', ip, 'ok'))
      .catch(()=>setStatus('page.scanner.status.nocopy','','err'));
  });

  /* ارسال آیپی(های) سالم به منبع Clean IPs / Domains */
  const sendToSource = async (values)=>{
    const list = (Array.isArray(values) ? values : [values]).map(v=>String(v).trim()).filter(Boolean);
    if(!list.length){ setStatus('page.scanner.status.noalive','','err'); return; }
    try{
      const d = await api('/api/clean-ips', { method:'POST', body:{ items: list } });
      if(d && d.added > 0) setStatus('page.scanner.status.sent','','ok','',d.added);
      else setStatus('page.scanner.status.dup','','err');
    }catch(e){
      if(e.message !== 'UNAUTHORIZED') setStatus('page.scanner.status.senderr', ' — ' + errMsg(e), 'err');
    }
  };
  const sendAlive = ()=>{
    const aliveIps = [...new Set(S.results.filter(i=>i.status === 'up').map(i=>i.ip))];
    if(aliveIps.length === 0){ setStatus('page.scanner.status.noalive','','err'); return; }
    if(!confirm(tr('page.scanner.confirm').replace('{n}', aliveIps.length))) return;
    sendToSource(aliveIps);
  };
  on(el.send,'click', sendAlive);
  on(el.sendMobile,'click', sendAlive);

  const copyAlive = ()=>{
    const aliveIps = [...new Set(S.results.filter(i=>i.status === 'up').map(i=>i.ip))];
    if(aliveIps.length === 0){ setStatus('page.scanner.status.noalive','','err'); return; }
    copyText(aliveIps.join('\n'))
      .then(()=>setStatus('page.scanner.status.copiedn','','ok','',aliveIps.length))
      .catch(()=>setStatus('page.scanner.status.nocopy','','err'));
  };
  on(el.copy,'click', copyAlive);
  on(el.copyMobile,'click', copyAlive);

  const clearScan = ()=>{ clearResults(); setStatus('page.scanner.status.ready','',''); };
  on(el.clear,'click', clearScan);
  on(el.clearMobile,'click', clearScan);
  on(el.start,'click', startScan);
  on(el.stop,'click', stopScan);

  on(el.ips,'keydown', e=>{
    /* Targets is intentionally a textarea: Enter is native, Space becomes a new target line. */
    if(e.key === ' ' || e.code === 'Space'){
      e.preventDefault();
      const start = el.ips.selectionStart, end = el.ips.selectionEnd;
      el.ips.setRangeText('\n', start, end, 'end');
      el.ips.dispatchEvent(new Event('input', {bubbles:true}));
    }
  });
  on(el.ports,'input', paintPortsPreview);

  /* leaving the page must kill any in-flight scan */
  addTeardown(()=>{
    S.seq++;
    if(S.abort){ try{ S.abort.abort(); }catch(e){} }
    S.abort = null; S.scanning = false;
  });

  clearResults();
  paintDynamic();
  setupReveal();
}

/* ============ PAGE INIT: Settings ============ */
function settingsInit(){
  setupReveal();

  /* شبکه‌های اجتماعی — فقط تلگرام لینک واقعی دارد، بقیه به‌زودی */
  document.querySelectorAll('.soc:not(#socTg)').forEach(a=>{
    a.addEventListener('click', e=>{
      e.preventDefault();
      toast(tr('page.settings.soon'), '#ffb454');
    });
  });

  const loadAll = async (attempt)=>{
    try{
      /* بارگذاری تنظیمات */
      const ds = await api('/api/settings', { method:'GET' });
      const st = ds.settings || {};
      if($('setMulti')) $('setMulti').checked = !!st.multiUser;
      if($('setUA')) $('setUA').value = st.subUserAgent || '';
    }catch(e){
      if(e && e.message === 'UNAUTHORIZED' && attempt < 3){
        await new Promise(r=>setTimeout(r,150));
        await loadAll(attempt+1);
      }
    }
  };
  loadAll(0);

  /* تغییر رمز */
  const passBtn = $('setPassBtn');
  if(passBtn){
    passBtn.addEventListener('click', async ()=>{
      const oldP = $('setOldPass').value, newP = $('setNewPass').value;
      if(!oldP || !newP){ toast(tr('page.settings.req'), '#ffb454'); return; }
      passBtn.disabled = true;
      try{
        await api('/api/auth/change-password', { method:'POST', body:{ oldPassword: oldP, newPassword: newP } });
        _adminPassChanged = true;
        $('setOldPass').value = ''; $('setNewPass').value = '';
        const s = $('setPassState');
        if(s){ s.textContent = tr('page.settings.passok'); s.classList.add('show'); setTimeout(()=>s.classList.remove('show'), 2400); }
        toast(tr('page.settings.passok'), '#3ddc97');
      }catch(e){
        if(e.message !== 'UNAUTHORIZED') toast(tr('users.operr') + ' — ' + errMsg(e), '#ff6b7a');
      }
      finally{ passBtn.disabled = false; }
    });
  }

  /* ذخیره تنظیمات */
  const saveBtn = $('setSave');
  if(saveBtn){
    saveBtn.addEventListener('click', async ()=>{
      saveBtn.disabled = true;
      try{
        const body = {
          multiUser: !!($('setMulti') && $('setMulti').checked),
          subUserAgent: ($('setUA') && $('setUA').value.trim()) || '',
        };
        await api('/api/settings', { method:'PUT', body });
        const s = $('setState');
        if(s){ s.textContent = tr('configs.saved'); s.classList.add('show'); setTimeout(()=>s.classList.remove('show'), 2400); }
        toast(tr('configs.saved'), '#3ddc97');
      }catch(e){
        if(e.message !== 'UNAUTHORIZED') toast(tr('users.operr') + ' — ' + errMsg(e), '#ff6b7a');
      }
      finally{ saveBtn.disabled = false; }
    });
  }

  /* ---------- حالت مخفی (disguise) ---------- */
  const disgOn = $('disgOn'), disgOff = $('disgOff'), disgRotate = $('disgRotate'),
        disgAdmin = $('disgAdmin'), disgSub = $('disgSub'), disgStatus = $('disgStatus'), disgState = $('disgState');
  async function loadDisg(){
    const d = await api('/api/disguise', { method:'GET' });
    const g = d.disguise || {};
    if(disgAdmin) disgAdmin.value = g.admin || '';
    if(disgSub) disgSub.value = g.sub || '';
    if(disgStatus){
      disgStatus.textContent = g.on ? tr('page.settings.disguise.onlbl') : tr('page.settings.disguise.offlbl');
      disgStatus.className = 'st ' + (g.on ? 'active' : 'suspended');
    }
    return g;
  }
  const disgAct = async (action, okMsg)=>{
    try{
      const d = await api('/api/disguise', { method:'POST', body:{ action } });
      const g = d.disguise || {};
      if(disgAdmin) disgAdmin.value = g.admin || '';
      if(disgSub) disgSub.value = g.sub || '';
      if(disgStatus){
        disgStatus.textContent = g.on ? tr('page.settings.disguise.onlbl') : tr('page.settings.disguise.offlbl');
        disgStatus.className = 'st ' + (g.on ? 'active' : 'suspended');
      }
      if(g.admin) setAdminPrefix(g.admin);
      if(disgState){ disgState.textContent = okMsg; disgState.classList.add('show'); setTimeout(()=>disgState.classList.remove('show'), 2600); }
      toast(okMsg, '#3ddc97');
    }catch(e){ if(e.message !== 'UNAUTHORIZED') toast(tr('users.operr') + ' — ' + errMsg(e), '#ff6b7a'); }
  };
  if(disgOn) disgOn.addEventListener('click', ()=> disgAct('enable', tr('page.settings.disguise.ondone')));
  if(disgRotate) disgRotate.addEventListener('click', ()=> disgAct('rotate', tr('page.settings.disguise.rotatedone')));
  if(disgOff) disgOff.addEventListener('click', ()=>{
    /* پنجره هشدار قبل از خاموش‌کردن */
    let veil = $('disgWarnVeil');
    if(veil) veil.remove();
    const holder = document.createElement('div');
    holder.innerHTML = `<div class="modal-veil" id="disgWarnVeil">
      <div class="modal" style="width:min(430px,calc(100vw - 32px))">
        <div class="modal-head"><h2>${tr('page.settings.disguise.warn.t')}</h2><button class="modal-x" id="disgWarnX" type="button" aria-label="Close">×</button></div>
        <div class="modal-body">
          <p class="info-desc" style="color:var(--amber)">${tr('page.settings.disguise.warn.d')}</p>
          <div class="form-actions" style="padding:12px 0 0">
            <button class="btn ghost danger" id="disgWarnYes" type="button">${tr('page.settings.disguise.warn.yes')}</button>
            <button class="btn primary" id="disgWarnNo" type="button">${tr('page.settings.disguise.warn.no')}</button>
          </div>
        </div>
      </div>
    </div>`;
    document.body.appendChild(holder.firstElementChild);
    veil = $('disgWarnVeil');
    veil.classList.add('show');
    const close = ()=>{ veil.remove(); document.removeEventListener('keydown', esc); };
    const esc = e=>{ if(e.key==='Escape') close(); };
    document.addEventListener('keydown', esc);
    veil.addEventListener('click', e=>{ if(e.target===veil) close(); });
    $('disgWarnX').onclick = close;
    $('disgWarnNo').onclick = close;
    $('disgWarnYes').onclick = ()=>{ close(); disgAct('disable', tr('page.settings.disguise.offdone')); };
  });
  loadDisg().catch(()=>{});
}

const PAGES = {
  overview: { html: OVERVIEW_HTML,  init: overviewInit  },
  configs:  { html: CONFIGS_HTML,   init: configsInit   },
  users:    { html: USERS_HTML,     init: usersInit     },
  scanner:  { html: SCANNER_HTML,   init: scannerInit   },
  settings: { html: SETTINGS_HTML,  init: settingsInit  }
};

/* ============ ROUTER ============ */
const pageRoot = document.getElementById('pageRoot');
let currentPage = null;

function setActiveNav(target){
  document.querySelectorAll('.nav-item,.mn-item').forEach(n=>n.classList.toggle('active', n.dataset.target===target));
}

function navigate(target){
  const page = PAGES[target] || PAGES.overview;
  /* 1. tear down previous page (intervals, listeners, observers) */
  runTeardowns();
  /* 2. completely remove previous page content from DOM */
  pageRoot.innerHTML = '';
  /* 3. render the new page */
  pageRoot.innerHTML = page.html;
  /* 4. update active nav state */
  setActiveNav(target);
  /* 5. run page-specific init scripts */
  if(page.init) page.init();
  currentPage = target;
  /* 6. apply current language to newly rendered content */
  applyTranslations();
  /* 7. reset scroll and update history */
  window.scrollTo(0, 0);
  if(location.hash.slice(1) !== target){
    try{ history.pushState({page: target}, '', '#' + target); }catch(e){}
  }
}

/* wire up sidebar + mobile nav */
document.querySelectorAll('.nav-item,.mn-item').forEach(n=>{
  n.addEventListener('click', e=>{
    e.preventDefault();
    const t = n.dataset.target;
    if(t) navigate(t);
  });
});

/* language toggle */
const langBtn = $('langToggle');
if(langBtn){
  langBtn.addEventListener('click', ()=>{
    currentLang = currentLang === 'fa' ? 'en' : 'fa';
    try{ localStorage.setItem('rahin-panel-language', currentLang); }catch(e){}
    applyTranslations();
  });
}

/* browser back/forward */
window.addEventListener('popstate', e=>{
  const t = (e.state && e.state.page) || location.hash.slice(1) || 'overview';
  navigate(PAGES[t] ? t : 'overview');
});

/* initial route */
const initial = (location.hash || '#overview').slice(1);
navigate(PAGES[initial] ? initial : 'overview');
</script>
